# 严格 DNS 基础配置（Shadowrocket + Mihomo/Clash Verge 通用）
#
# 设计目标：不依赖规则集覆盖，未知域名也能被正确判定，且不出现任何国内 DNS。
#
# 做法：全部域名由境外 DoH 经代理解析，解析结果交给 GEOIP,CN 判定走直连还是走代理。
# 规则集只负责"已知的例外"，未收录的域名靠 IP 兜底——因此不存在"规则集覆盖不全"的问题。
#
# 关键是必须带 ECS。不带 ECS 时国内 CDN 按"提问者在境外"分配节点，会把你导向
# 海外边缘节点：实测 www.bilibili.com 解析到 192.254.90.178（美国洛杉矶）、
# i0.hdslb.com 到 138.113.102.14（加拿大多伦多）。而 bilibili.com 命中域名规则
# 被判 DIRECT，于是变成从国内直连一台美国服务器，又慢又容易被掐。
# 带上华北联通 ECS 后同样的域名解析到 218.60.18.14（辽宁联通），恢复正常。
#
# 关于 #proxy：
#   Shadowrocket —— 原生的 DNS-over-proxy 关键字
#   Mihomo       —— 把 # 后的名称当作策略组名查找，配套 .ini 中定义了名为 proxy 的组
# 若 .ini 里的 proxy 组被删除或改名，Mihomo 会把 proxy 当网卡名去绑，绑不上，
# 本地 DNS 全部失效——表现为境外网站正常、国内直连站点全部打不开。

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false

geo-auto-update: true
geo-update-interval: 24

dns:
  enable: true
  ipv6: false
  listen: 127.0.0.1:1053
  # 必须是 redir-host。fake-ip 下 GEOIP,CN 拿到的是 198.18.x.x 假 IP，
  # 整个按 IP 判定的设计会失效。
  enhanced-mode: redir-host

  # 以下两项正常情况下不会被触发，刻意填境外地址：
  # 一旦被触发应当解析失败，而不是退回国内 DNS。
  # 若节点改用域名形式，代理会起不来（而非静默泄露），此时用 hosts 钉死节点 IP。
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  proxy-server-nameserver:
    - 1.1.1.1
    - 8.8.8.8

  # 全部业务域名：境外 DoH，经代理发出，附带华北联通 ECS。
  #
  # 只用 Google：Cloudflare 按其隐私政策不转发 ECS，混进来会出现"谁先应答用谁"
  # 的抖动，一旦用了 Cloudflare 的结果，国内站点就会拿到海外节点。
  #
  # ↓ 换成你所在地运营商的网段，CDN 选点会更贴近：
  #     联通北京 202.106.0.0/24（当前）  电信上海 202.96.209.0/24
  #     电信广东 202.96.128.0/24         移动     211.136.192.0/24
  nameserver:
    - "https://8.8.8.8/dns-query#proxy&ecs=202.106.0.0/24&ecs-override=true"
    - "https://8.8.4.4/dns-query#proxy&ecs=202.106.0.0/24&ecs-override=true"

# 少数站点的权威服务器不认 ECS（www.baidu.com）或使用全球 CDN（ctrip.com、
# qunar.com），仍会解析到境外 IP，GEOIP,CN 会判错。它们由 ChinaDomain.list
# 按域名兜住，该规则集位置在 GEOIP,CN 之前。
